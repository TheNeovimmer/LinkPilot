name: linkpilot

# Production stack: API + web (nginx). Database is Neon (serverless Postgres) — no local Postgres/Redis.
# `docker compose up --build` then open http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      # DATABASE_URL comes from your .env (set the pooled Neon URL there).
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_URL: http://localhost:8080
      CLIENT_URL: http://localhost:8080
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
